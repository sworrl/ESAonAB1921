name: Refresh data and deploy

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-deploy
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh bill status and wiki talking points
        run: node scripts/update-data.mjs

      - name: Commit refreshed data
        # Persisting the refresh back to the repo is best-effort: a push race
        # or re-run must never block the Pages deploy that follows.
        continue-on-error: true
        run: |
          if ! git diff --quiet -- data; then
            git config user.name "savestate-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "data: scheduled refresh"
            git push
          else
            echo "No data changes."
          fi

      - name: Stamp build time for the AI-disclosure note
        run: printf '{"built_at":"%s","builder":"Claude Code (Fable 5)"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > build.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
